; ; PlatformIO Project Configuration File
; ;
; ;   Build options: build flags, source filter
; ;   Upload options: custom upload port, speed and extra flags
; ;   Library options: dependencies, extra library storages
; ;   Advanced options: extra scripting
; ;
; ; Please visit documentation for the other options and examples
; ; https://docs.platformio.org/page/projectconf.html

; [env:esp32-c6-devkitc-1]
; platform = espressif32
; board = esp32-c6-devkitc-1
; framework = espidf

[env:esp32-c6-devkitc-1]
; We use the community-maintained "pioarduino" for the latest C6 support
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; These flags are CRITICAL for the C6 to talk to your computer via USB
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200

; Pin the port so PlatformIO never auto-detects a Bluetooth serial device
; (e.g. paired headphones) instead of the board. Wildcard survives the port
; number changing between plug-ins.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
lib_deps =
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X
    h2zero/NimBLE-Arduino
    bogde/HX711 @ ^0.7.4
